# Wildcard certificate for the lab, in the traefik namespace so the Gateway
# (same namespace) and Traefik's default TLS store can use the Secret.
# Issued first by letsencrypt-staging, then switched to letsencrypt-prod.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-wildcard
  namespace: traefik
spec:
  secretName: lab-wildcard-tls
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  dnsNames:
    - lab.thalespm.me
    - "*.lab.thalespm.me"
