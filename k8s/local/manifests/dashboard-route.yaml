apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dashboard
  namespace: kubernetes-dashboard
spec:
  parentRefs:
    - name: lab-gateway
      namespace: traefik
  hostnames:
    - dashboard.lab.thalespm.me
  rules:
    - backendRefs:
        - name: kubernetes-dashboard-kong-proxy
          port: 80
