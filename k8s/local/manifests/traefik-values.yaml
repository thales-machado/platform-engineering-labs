# Traefik Helm values (ADR 0008). Chart traefik/traefik 42.3.1, Traefik v3.7.17.
# <TRAEFIK_IP>: first IP of the MetalLB pool, fixed so DNS can point to it.
# Gateway API CRDs are not shipped with the chart: install them first (step 1.17).
service:
  annotations:
    metallb.io/loadBalancerIPs: <TRAEFIK_IP>
providers:
  kubernetesIngress:
    enabled: true
  kubernetesGateway:
    enabled: true
# The Gateway is a separate manifest (manifests/whoami.yaml), not created by the chart.
gateway:
  enabled: false
ingressClass:
  enabled: true
  isDefaultClass: true
