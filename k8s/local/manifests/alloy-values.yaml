# alloy 1.15.0 (app v1.21.3), namespace lab-obs. ADR 0016.
# DaemonSet on both nodes. Logs are read through the Kubernetes API rather than
# from host paths, so nothing is mounted from the node and the Pi carries the
# smallest possible agent.
#
# The Loki single binary is reached through the `loki` Service on 3100,
# confirmed after installing the chart.

controller:
  type: daemonset

alloy:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  configMap:
    content: |-
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.lab-obs.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
