# Step 2.6: open the newest etcd snapshot and read keys out of it. A snapshot
# nobody has restored is a guess, and PM-0006 was a file that looked fine until
# something tried to use it.
#
# Nothing here touches the live cluster: /var/lib/etcd is mounted read-only,
# the restore lands in an emptyDir, and the second etcd listens on loopback
# inside this pod's own network namespace, not on the host.
#
# The etcd image is distroless and has no shell, so every container runs a
# binary directly with arguments. Only the first step needs a shell, to pick
# the newest file, and that one uses busybox.
#
#   kubectl apply -f drills/etcd-restore-check.yaml
#   kubectl -n kube-system logs etcd-restore-check -c status
#   kubectl -n kube-system logs etcd-restore-check -c restore
#   kubectl -n kube-system exec etcd-restore-check -- etcdctl \
#     --endpoints http://127.0.0.1:2399 get /registry/namespaces --prefix --keys-only
#   kubectl -n kube-system delete pod etcd-restore-check
apiVersion: v1
kind: Pod
metadata:
  name: etcd-restore-check
  namespace: kube-system
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: urahara
  initContainers:
    - name: pick
      image: busybox:stable
      securityContext:
        runAsUser: 0
      command:
        - sh
        - -c
        - 'set -e; S=$(ls -t /snap/snapshot-*.db | head -1); echo "newest snapshot: $S"; cp "$S" /work/snapshot.db; ls -lh /work/snapshot.db'
      volumeMounts:
        - { name: snapshots, mountPath: /snap, readOnly: true }
        - { name: work, mountPath: /work }
    - name: status
      image: registry.k8s.io/etcd:3.7.0-0
      securityContext:
        runAsUser: 0
      command: ["etcdutl", "snapshot", "status", "/work/snapshot.db", "-w", "table"]
      volumeMounts:
        - { name: work, mountPath: /work }
    - name: restore
      image: registry.k8s.io/etcd:3.7.0-0
      securityContext:
        runAsUser: 0
      command:
        - etcdutl
        - snapshot
        - restore
        - /work/snapshot.db
        - --name=restore-check
        - --initial-cluster=restore-check=http://127.0.0.1:2400
        - --initial-advertise-peer-urls=http://127.0.0.1:2400
        - --data-dir=/work/etcd
      volumeMounts:
        - { name: work, mountPath: /work }
  containers:
    - name: etcd
      image: registry.k8s.io/etcd:3.7.0-0
      securityContext:
        runAsUser: 0
      command:
        - etcd
        - --data-dir=/work/etcd
        - --name=restore-check
        - --listen-client-urls=http://127.0.0.1:2399
        - --advertise-client-urls=http://127.0.0.1:2399
        - --listen-peer-urls=http://127.0.0.1:2400
        - --initial-advertise-peer-urls=http://127.0.0.1:2400
        - --initial-cluster=restore-check=http://127.0.0.1:2400
        - --initial-cluster-token=restore-check
        - --listen-metrics-urls=http://127.0.0.1:2401
      volumeMounts:
        - { name: work, mountPath: /work }
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
  volumes:
    - name: snapshots
      hostPath:
        path: /var/lib/etcd
        type: Directory
    - name: work
      emptyDir: {}
