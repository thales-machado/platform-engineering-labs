replicaCount: 2

image:
  repository: ghcr.io/stefanprodan/podinfo
  # Empty means Chart.appVersion. Multi-arch (amd64 and arm64).
  tag: ""
  pullPolicy: IfNotPresent

# Non-secret settings, rendered into a ConfigMap and read as env vars.
ui:
  message: "Hello from the k8s/local lab"
  color: "#2f6f73"

# Demo secret, read as an env var. Two ways to provide it:
#   existingSecret: the name of a Secret created outside the chart, which is
#     what Argo CD needs (ADR 0018): a token rendered from values would live in
#     a public repository.
#   apiToken: rendered into a Secret by the chart. Only for a hand-installed
#     release, overridden with --set, never committed.
secret:
  existingSecret: ""
  apiToken: "change-me"

# Scrape the app itself. Needed before any canary analysis: the decision to
# promote or abort reads these metrics.
serviceMonitor:
  enabled: true

# Extra flags for podinfo. Used in step 4 to ship a version that fails on
# purpose, so the canary analysis has something real to reject.
extraArgs:
  # DRILL 2026-11-16, second run: same broken build, now that the analysis
  # waits 90s before its first measurement. Expected around 0.67, not 0.948.
  - "--random-error=true"

# Step 4: progressive delivery. With this off the chart renders a plain
# Deployment, so it still works on a cluster without Argo Rollouts.
rollout:
  enabled: true
  # Share of successful requests the canary must hold to be promoted.
  successRate: "0.95"
  prometheusAddress: http://kube-prometheus-stack-prometheus.lab-obs.svc.cluster.local:9090

# podinfo writes a line per HTTP request only at debug. At info it is silent
# after boot, which leaves the lab with no application logs to query.
logLevel: debug

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 128Mi

# Exposed through the shared Gateway (components/traefik/whoami.yaml), HTTP and HTTPS listeners.
route:
  enabled: true
  hostname: app.lab.thalespm.me
  gateway:
    name: lab-gateway
    namespace: traefik

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60

podDisruptionBudget:
  enabled: true
  minAvailable: 1
