{{- if not .Values.secret.existingSecret }}
{{- /*
  Rendered only when no existing Secret is named. Under Argo CD (ADR 0018) the
  chart is synced from Git, and a Secret rendered from values would mean the
  token lives in a public repository: setting secret.existingSecret points the
  Deployment at a Secret created by hand instead.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lab-app.fullname" . }}
  labels:
    {{- include "lab-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  API_TOKEN: {{ .Values.secret.apiToken | quote }}
{{- end }}
