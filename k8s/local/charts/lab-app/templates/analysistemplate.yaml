{{- if .Values.rollout.enabled }}
{{- /*
  The question the canary has to answer: of the requests the new version
  served, how many did not fail? Measured on the canary Service only, so the
  stable pods cannot hide a broken version behind their own healthy traffic.

  failureLimit 0 means one bad measurement aborts and the Rollout scales the
  canary back to zero on its own.

  Two things the drill of 2026-11-16 corrected, both found by counting the
  real samples instead of trusting the query:

  Probe and scrape paths are excluded. podinfo counts every request, the
  kubelet hits readyz every 5s and healthz every 10s on each pod, and
  Prometheus scrapes /metrics through three Services. Over the drill those
  were 1643 samples against 1527 of real traffic: more than half the
  denominator was traffic that cannot fail. The quieter the real traffic, the
  more they hide a broken canary.

  Failures are 4xx and 5xx, not 5xx alone. The broken build returned 19
  responses of 400 and 12 of 409 for every 14 of 500, and a query counting
  only 5.. ignored two thirds of them. A version that rejected every request
  with a 400 would have passed this analysis without a mark.

  With little traffic the query returns nothing and the measurement is
  Inconclusive rather than failed, which pauses instead of promoting. That is
  the safe direction, and it is why the drill generates load.
*/}}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "lab-app.fullname" . }}-success-rate
  labels:
    {{- include "lab-app.labels" . | nindent 4 }}
spec:
  metrics:
    - name: success-rate
      # The first measurement must not start until rate([1m]) contains only
      # canary samples. Until the canary pod exists, the canary Service points
      # at the stable pods, and their healthy traffic stays inside the window:
      # in the drill of 2026-11-16 that read 0.948 for a build whose real
      # success rate was 0.67, which is a near miss, not a pass.
      initialDelay: 90s
      interval: 30s
      count: 3
      successCondition: result[0] >= {{ .Values.rollout.successRate }}
      failureLimit: 0
      provider:
        prometheus:
          address: {{ .Values.rollout.prometheusAddress }}
          query: |
            sum(rate(http_request_duration_seconds_count{
              namespace="{{ .Release.Namespace }}",
              service="{{ include "lab-app.fullname" . }}-canary",
              path!~"healthz|readyz|metrics",
              status!~"[45].."}[1m]))
            /
            sum(rate(http_request_duration_seconds_count{
              namespace="{{ .Release.Namespace }}",
              service="{{ include "lab-app.fullname" . }}-canary",
              path!~"healthz|readyz|metrics"}[1m]))
{{- end }}
