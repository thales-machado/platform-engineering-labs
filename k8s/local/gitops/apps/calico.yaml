# The Tigera Installation that configures Calico: VXLAN, the pod CIDR, and the
# nftables dataplane from PM-0002.
#
# Only the configuration. The Tigera operator itself was installed in step 1
# from an upstream URL and is not in this repository, so a cluster rebuilt from
# Git alone needs that one command first. Worth knowing before trusting "it is
# all in Git".
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: calico
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/thales-machado/platform-engineering-labs.git
    targetRevision: main
    path: k8s/local/components/calico
  destination:
    server: https://kubernetes.default.svc
    namespace: tigera-operator
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
