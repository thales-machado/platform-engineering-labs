# rollouts.lab.thalespm.me: the read-only dashboard that shows canary steps as
# they run. Same Gateway pattern as Grafana, the Dashboard and Argo CD.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argo-rollouts-dashboard
  namespace: argo-rollouts
spec:
  parentRefs:
    - name: lab-gateway
      namespace: traefik
  hostnames:
    - rollouts.lab.thalespm.me
  rules:
    - backendRefs:
        - name: argo-rollouts-dashboard
          port: 3100
