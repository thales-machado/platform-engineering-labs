# MetalLB v0.16.2 L2 configuration (ADR 0005).
# Fixed LAN IPs outside the router's DHCP range,
# checked free before install (ping and ARP). One IP in the planned range was
# already in use on the LAN, so the pool stops before it.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lan-pool
  namespace: metallb-system
spec:
  addresses:
    # Real values, not placeholders. Under GitOps a placeholder is applied by
    # a controller on a timer: Argo spent 2026-11-16 trying to write the
    # literal string here, and only MetalLB's validating webhook stopped it.
    - 192.168.15.241-192.168.15.247
  autoAssign: true
  avoidBuggyIPs: false
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lan-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - lan-pool
