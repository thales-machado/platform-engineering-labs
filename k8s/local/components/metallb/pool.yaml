# MetalLB v0.16.2 L2 configuration (ADR 0005).
# <POOL_START>-<POOL_END>: fixed LAN IPs outside the router's DHCP range,
# checked free before install (ping and ARP). One IP in the planned range was
# already in use on the LAN, so the pool stops before it.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lan-pool
  namespace: metallb-system
spec:
  addresses:
    - <POOL_START>-<POOL_END>
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lan-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - lan-pool
