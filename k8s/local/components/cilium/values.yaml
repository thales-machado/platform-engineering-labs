# Cilium 1.20.4 after the migration, Calico gone. ADR 0019, phase 4.
#
# The difference from values-migration.yaml is the whole point: Cilium now owns
# the CNI config, enforces policy, and the operator may restart pods it finds
# unmanaged.

operator:
  replicas: 1
  nodeSelector:
    kubernetes.io/hostname: urahara
  unmanagedPodWatcher:
    restart: true

routingMode: tunnel
tunnelProtocol: vxlan
tunnelPort: 8472

ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.245.0.0/16
    clusterPoolIPv4MaskSize: 24

cni:
  # Cilium is the CNI now.
  customConf: false
  exclusive: true

policyEnforcementMode: default

bpf:
  # Kept true for now. Switching to eBPF host routing interrupts each node
  # briefly, so it is a change of its own, not a side effect of cleanup.
  hostLegacyRouting: true

# ADR 0020. Cilium handles Services in eBPF instead of kube-proxy's iptables
# chains. Enabled in phase 1 while kube-proxy is still installed, which is a
# supported overlap and the point at which this is still trivially reversible.
kubeProxyReplacement: true

# Required without kube-proxy: there is no iptables rule for the kubernetes
# Service any more, so the agents need the API server's real address. One
# control plane, so this is urahara. If urahara is down the agents cannot
# reach the API server, which was already true and is now written down.
k8sServiceHost: 192.168.15.215
k8sServicePort: 6443

# Flow visibility, the reason this lab wanted Cilium beyond the dataplane.
hubble:
  enabled: true
  relay:
    enabled: true
    nodeSelector:
      kubernetes.io/hostname: urahara
  ui:
    enabled: true
    nodeSelector:
      kubernetes.io/hostname: urahara
