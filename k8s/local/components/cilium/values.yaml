# Cilium 1.20.4 after the migration, Calico gone. ADR 0019, phase 4.
#
# The difference from values-migration.yaml is the whole point: Cilium now owns
# the CNI config, enforces policy, and the operator may restart pods it finds
# unmanaged.

operator:
  replicas: 1
  nodeSelector:
    kubernetes.io/hostname: urahara
  unmanagedPodWatcher:
    restart: true

routingMode: tunnel
tunnelProtocol: vxlan
tunnelPort: 8472

ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.245.0.0/16
    clusterPoolIPv4MaskSize: 24

cni:
  # Cilium is the CNI now.
  customConf: false
  exclusive: true

policyEnforcementMode: default

bpf:
  # Kept true for now. Switching to eBPF host routing interrupts each node
  # briefly, so it is a change of its own, not a side effect of cleanup.
  hostLegacyRouting: true

# ADR 0020 attempted this on 2026-11-18 and reverted it the same hour.
#
# kubeProxyReplacement loads Cilium's socket load balancer programs
# (cil_sock4_connect and friends), which need CO-RE relocations, which need
# BTF in the kernel. zangetsu runs 6.18.34+rpt-rpi-2712, the Raspberry Pi
# vendor kernel, and it ships no BTF:
#
#   failed loading eBPF collection into the kernel: program cil_sock4_connect:
#   apply CO-RE relocations: load kernel spec:
#   no BTF found for kernel version 6.18.34+rpt-rpi-2712: not supported
#
# The agent then never initialises its datapath, so no new pod on that node
# gets an endpoint. Existing pods keep working, which is what made it quiet.
# See PM-0012.
kubeProxyReplacement: false

# Harmless with kube-proxy present, and required the moment it is not, so it
# stays: the agents reach the API server directly instead of through a Service.
k8sServiceHost: 192.168.15.215
k8sServicePort: 6443

# Flow visibility, the reason this lab wanted Cilium beyond the dataplane.
hubble:
  enabled: true
  relay:
    enabled: true
    nodeSelector:
      kubernetes.io/hostname: urahara
  ui:
    enabled: true
    nodeSelector:
      kubernetes.io/hostname: urahara
