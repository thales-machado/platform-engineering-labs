# kube-prometheus-stack 93.2.2, namespace lab-obs. ADR 0016.
# Everything stateful is pinned to urahara (28 GiB, NVMe); zangetsu (7.9 GiB,
# 3.5 GiB free) runs only the node-exporter DaemonSet.

# Alerting on the availability of this cluster lives outside it, in the homelab
# stack (step 2.2): an Alertmanager in here would be down whenever the cluster is.
# Rules still evaluate and are visible in Grafana; they just do not page.
alertmanager:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 8GiB
    scrapeInterval: 30s
    # Without these four, the operator only picks up objects created by this
    # chart, and the ServiceMonitors we write for Calico, Traefik and CNPG are
    # ignored with no error anywhere.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    nodeSelector:
      kubernetes.io/hostname: urahara
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 10Gi

grafana:
  enabled: true
  # Routing and TLS come from the shared Gateway, as with the Dashboard.
  ingress:
    enabled: false
  nodeSelector:
    kubernetes.io/hostname: urahara
  persistence:
    enabled: true
    storageClassName: local-path
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 384Mi
  grafana.ini:
    server:
      root_url: https://grafana.lab.thalespm.me
  # The chart wires Prometheus as the default datasource; Loki is added here so
  # metrics and logs are usable from the same Grafana.
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.lab-obs.svc.cluster.local:3100
      isDefault: false
  # Credentials come from a Secret created by hand on the cluster, the same idea
  # as ${ADMIN_USER} / ${ADMIN_PASSWORD} in the homelab .env: the names are in
  # git, the values never are.
  #   kubectl -n lab-obs create secret generic grafana-admin \
  #     --from-literal=admin-user=... --from-literal=admin-password=...
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

prometheusOperator:
  nodeSelector:
    kubernetes.io/hostname: urahara
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

kube-state-metrics:
  nodeSelector:
    kubernetes.io/hostname: urahara
  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      memory: 192Mi

prometheus-node-exporter:
  # The DaemonSet uses the host network, and the homelab already runs its own
  # node-exporter on 9100 on urahara: the in-cluster one crash-looped with
  # "bind: address already in use". Both are kept, on different ports.
  service:
    port: 9101
    targetPort: 9101
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 64Mi

# kubeadm binds these components' metrics to 127.0.0.1, so nothing outside the
# node can scrape them. Each one was opened in its own round on 2026-11-12,
# with a check in between, rather than all at once: doing both at once hides
# which change broke what. The bind addresses live on the control plane node,
# not in this file, so a rebuilt node needs them again (step 2.4).
# --bind-address=0.0.0.0, 2026-11-12. Port 10257, same auth model as the
# scheduler.
kubeControllerManager:
  enabled: true
# --bind-address=0.0.0.0 in /etc/kubernetes/manifests/kube-scheduler.yaml,
# 2026-11-12. The port still demands a bearer token; the chart's ServiceMonitor
# uses https with insecureSkipVerify, because the certificate is for the node
# name and the target is the pod IP.
kubeScheduler:
  enabled: true
# metricsBindAddress: "0.0.0.0:10249" in the kube-system/kube-proxy ConfigMap,
# 2026-11-12. Plain HTTP with no authentication, unlike the other components.
kubeProxy:
  enabled: true
# --listen-metrics-urls=http://0.0.0.0:2381, 2026-11-12. Port 2381 serves
# /metrics and /health only; the key-value API stays on 2379 behind client
# certificates.
kubeEtcd:
  enabled: true
  service:
    port: 2381
    targetPort: 2381
  serviceMonitor:
    scheme: http
