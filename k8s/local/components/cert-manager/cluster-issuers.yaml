# Let's Encrypt ClusterIssuers with the Cloudflare DNS-01 solver.
# Staging first (no rate limits, untrusted certificates), then production.
# The token Secret "cloudflare-api-token" lives in the cert-manager namespace and
# is created by hand (never committed): Zone DNS Edit + Zone Read, thalespm.me only.
# Contact address for the Let's Encrypt account. An alias on a domain under
# our control rather than a personal address: this repository is public, and a
# placeholder is not an option, because Argo applies what is written here on a
# timer: on 2026-11-16 it wrote the placeholder that used to be on this line
# into both issuers, which stayed Ready only because the account registration
# is cached in its Secret. See PM-0007.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: acme@thalespm.me
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - thalespm.me
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: acme@thalespm.me
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - thalespm.me
