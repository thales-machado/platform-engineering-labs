# Let's Encrypt ClusterIssuers with the Cloudflare DNS-01 solver.
# Staging first (no rate limits, untrusted certificates), then production.
# The token Secret "cloudflare-api-token" lives in the cert-manager namespace and
# is created by hand (never committed): Zone DNS Edit + Zone Read, thalespm.me only.
# <ACME_EMAIL>: contact address for the Let's Encrypt account.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: <ACME_EMAIL>
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - thalespm.me
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: <ACME_EMAIL>
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - thalespm.me
